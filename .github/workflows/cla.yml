name: Contributor licence agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  cla:
    uses: orbyn-dev/.github/.github/workflows/cla.yml@288e82f939e4bea16ff009af606b069cf085e11c
    with:
      agreement-version: "0.1"
    secrets:
      signatures-token: ${{ secrets.CLA_SIGNATURES_TOKEN }}
